[project]
name = "iam"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.135,<1.0",
  "pydantic-settings>=2.10",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam"]
