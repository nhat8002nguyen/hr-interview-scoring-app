x-api-build: &api-build
  context: ./apps/backend
  dockerfile: Dockerfile.dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql

  migrate:
    image: talot-assessment-api:local
    build: *api-build
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/talot
    depends_on:
      db:
        condition: service_healthy

  api:
    image: talot-assessment-api:local
    build: *api-build
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/talot
      JWT_SECRET: dev-secret-change-me-in-production
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      CANDIDATE_WEB_ORIGIN: http://localhost:3001
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: deepseek-chat
      AUDIO_STORAGE_DIR: /data/audio
      SCORING_WORKERS: "2"
      SCORING_MAX_ATTEMPTS: "3"
      SEED_HR_EMAIL: hr@talotrace.ai
      SEED_HR_PASSWORD: change-me
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - audio-data:/data/audio
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  candidate-web:
    build:
      context: ./apps/candidate-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  hr-web:
    build:
      context: ./apps/hr-web
      args:
        NEXT_PUBLIC_API_URL: http://api:3000
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  audio-data:
