upstream talot_api {
  server talot-api:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name talot-api.nate-ng.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name talot-api.nate-ng.com;
  client_max_body_size 25m;

  ssl_certificate /etc/letsencrypt/live/talot-api.nate-ng.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/talot-api.nate-ng.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://talot_api;
  }
}
