[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "database",
  "iam",
  "fastapi>=0.135,<1.0",
  "uvicorn>=0.38",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "alembic>=1.17",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
