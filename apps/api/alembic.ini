# A generic, single database configuration.

[alembic]
script_location = migrations

# Prepend the directory containing this ini file to sys.path so that the
# installed `api`, `database`, and `iam` packages resolve when running from
# this directory.
prepend_sys_path = .

# A placeholder URL; the real value is provided by api.config.Settings in env.py.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/talotrace

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
