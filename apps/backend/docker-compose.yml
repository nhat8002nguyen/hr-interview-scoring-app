name: talotrace-backend

x-api-build: &api-build
  context: .
  dockerfile: Dockerfile.dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-talot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-talot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql

  migrate:
    image: talotrace-backend:local
    build: *api-build
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-talot}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: talotrace-backend:local
    build: *api-build
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-talot}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002}
      CANDIDATE_WEB_ORIGIN: ${CANDIDATE_WEB_ORIGIN:-http://localhost:3001}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AUDIO_STORAGE_DIR: /data/audio
      SCORING_WORKERS: ${SCORING_WORKERS:-2}
      SCORING_MAX_ATTEMPTS: ${SCORING_MAX_ATTEMPTS:-3}
      SCORING_LEASE_TIMEOUT_SECONDS: ${SCORING_LEASE_TIMEOUT_SECONDS:-300}
      MAX_ANSWER_SUBMISSIONS: ${MAX_ANSWER_SUBMISSIONS:-3}
      SEED_HR_EMAIL: ${SEED_HR_EMAIL:-hr@talotrace.ai}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD:-change-me}
    volumes:
      - audio-data:/data/audio
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db-data:
  audio-data:
