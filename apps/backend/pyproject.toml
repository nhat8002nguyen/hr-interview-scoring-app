[project]
name = "api"
version = "0.1.0"
description = "Talotrace interview-scoring backend"
requires-python = ">=3.14"
dependencies = [
  "database",
  "iam",
  "fastapi>=0.135,<1.0",
  "uvicorn>=0.38",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "alembic>=1.17",
  "httpx>=0.28",
  "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.workspace]
members = [
  "libs/database",
  "libs/iam",
]

[tool.uv.sources]
database = { workspace = true }
iam = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.2",
  "ruff>=0.14",
  "mypy>=1.18",
  "httpx>=0.28",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["libs", "src"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["(.*/)?migrations/", "(.*/)?tests/"]
